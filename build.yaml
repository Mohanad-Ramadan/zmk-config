# Split Keyboard Halves Unable to Pair:
#   https://zmk.dev/docs/troubleshooting
# Reset Split Keyboard Procedure:
# 1. Put each half into bootloader mode.
# 2. Flash settings_reset.uf2 to one half; immediately put it back into bootloader.
# 3. Repeat step 2 with the other half.
# 4. Flash sofle_left.uf2 to the left half, sofle_right.uf2 to the right half.
# 5. Reset both halves simultaneously to re-pair.
---
include:

  # Sofle v2 — left half (central). Sleep/idle/Studio config comes from sofle.conf.
  # nice_oled = 128x32 SSD1306 I2C minimal (mctechnology17/zmk-nice-oled, v0.3.0)
  - board: nice_nano_v2
    shield: sofle_left nice_oled
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Sofle\"
    artifact-name: sofle_left
    snippet: studio-rpc-usb-uart

  # Sofle v2 — right half (peripheral).
  - board: nice_nano_v2
    shield: sofle_right nice_oled
    artifact-name: sofle_right

  # Flash to BOTH halves to clear bonding before re-pairing.
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
